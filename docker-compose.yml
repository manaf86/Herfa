# بيئة التطوير المحلية لـ حِرفة
# لا تستخدم هذه القيم في الإنتاج أبداً.
name: herfa

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: herfa
      POSTGRES_PASSWORD: herfa_dev_pw
      POSTGRES_DB: herfa
    ports: ["5432:5432"]
    volumes:
      - ./docker-data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herfa"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: herfa_dev_master_key_change_me
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes:
      - ./docker-data/meili:/meili_data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: herfa
      MINIO_ROOT_PASSWORD: herfa_dev_pw
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - ./docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]

  clamav:
    # فحص الملفات المرفوعة. ثقيل — عطّله إن كان جهازك ضعيفاً.
    image: clamav/clamav:latest
    restart: unless-stopped
    ports: ["3310:3310"]
    profiles: ["full"]
